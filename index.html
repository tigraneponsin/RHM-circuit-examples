<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Circuit Tracing Gallery</title>
  <style>
    :root { --fg:#1a1a1a; --muted:#666; --line:#e2e2e2; --bg:#fafafa; --accent:#2563eb; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
           color: var(--fg); background: var(--bg); margin: 0; line-height: 1.5; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 48px 24px 80px; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    .sub { color: var(--muted); margin: 0 0 4px; }
    .count { color: var(--muted); font-size: 13px; margin: 24px 0 12px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { border: 1px solid var(--line); border-radius: 10px; background: #fff; margin-bottom: 12px;
         transition: border-color .12s, box-shadow .12s; }
    li:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    a.card { display: block; padding: 16px 18px; text-decoration: none; color: inherit; }
    .title { font-weight: 600; font-size: 16px; color: var(--accent); }
    .desc { color: var(--muted); font-size: 14px; margin-top: 4px; }
    footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
    code { background: #eee; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Circuit Tracing Gallery</h1>
    <p class="sub">Interactive attribution-graph visualizations for transformers trained on the Random Hierarchy Model.</p>
    <p class="count" id="count"></p>
    <ul id="list"></ul>
    <footer>
      To add a circuit: drop its <code>.html</code> into <code>circuits/</code> and add one entry to the
      <code>circuits</code> array near the top of this file.
    </footer>
  </div>

  <script>
    // ─── Add new circuits here ────────────────────────────────────────────────
    // file: path relative to this page · title: shown as the link · desc: one line
    const circuits = [
      {
        file: "circuits/sweep_circuit_nores_0.html",
        title: "Sweep circuit — residual ablated (example 0)",
        desc: "Attribution-graph sweep over an RHM transformer with the residual stream removed."
      },
    ];
    // ──────────────────────────────────────────────────────────────────────────

    const list = document.getElementById("list");
    document.getElementById("count").textContent =
      circuits.length + (circuits.length === 1 ? " circuit" : " circuits");
    for (const c of circuits) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "card";
      a.href = c.file;
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML =
        '<div class="title">' + c.title + '</div>' +
        (c.desc ? '<div class="desc">' + c.desc + '</div>' : '');
      li.appendChild(a);
      list.appendChild(li);
    }
  </script>
</body>
</html>
